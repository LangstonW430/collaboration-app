name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the full suite, E2E included, be run against a branch before it
  # reaches main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static checks (lint, types, production build) ───────────────────────────
  verify:
    name: Lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # The client throws at import time without a deployment URL. A
        # placeholder is enough to compile; nothing here talks to Convex.
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}
        run: npm run build

  # ── Unit tests (always run, no backend needed) ──────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage summary (PR comment)
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          json-summary-path: coverage/coverage-summary.json

  # ── E2E tests (only when Convex credentials are present) ───────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run E2E when the secret is configured (avoid failing on forks)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       vars.RUN_E2E == 'true')
    needs: [verify, unit]

    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      E2E_USER1_EMAIL: ${{ secrets.E2E_USER1_EMAIL }}
      E2E_USER1_PASSWORD: ${{ secrets.E2E_USER1_PASSWORD }}
      E2E_USER2_EMAIL: ${{ secrets.E2E_USER2_EMAIL }}
      E2E_USER2_PASSWORD: ${{ secrets.E2E_USER2_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Deploy Convex functions
        # The suite drives a real deployment, so the backend it exercises has
        # to be the one built from this commit. Without this step CI runs the
        # frontend from HEAD against whatever backend was last pushed by hand,
        # and any change to a Convex function fails E2E while being correct.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not set, so the backend cannot be deployed and E2E would test a stale one. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx convex deploy

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/playwright-report/
          retention-days: 14
